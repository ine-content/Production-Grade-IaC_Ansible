# .gitlab-ci.yml — CI/CD Pipeline with Ansible (lab 12)
#
# This file is prebuilt. Do not modify it - it exists to give
# run_playbook.sh somewhere real to be triggered from.
#
#   build_and_stage    - runs automatically on every pipeline. Runs
#                        `./run_playbook.sh --limit staging`, which starts
#                        the mock device fleet itself, then runs site.yml
#                        end to end over RESTCONF against SEA03's 2
#                        staging devices only (auto_deploy: true in
#                        group_vars/staging.yml). RDU01 and AUS02's 7
#                        production devices are excluded from this job by
#                        --limit, on top of already being held back by
#                        push_authorized (see site.yml, TODO 08) - neither
#                        gate depends on the other.
#
#   deploy_production  - a MANUAL job. It does not run until a human opens
#                        this pipeline in the GitLab UI and clicks
#                        Play/Approve on this specific job. It then runs
#                        `./run_playbook.sh --limit prod` (a fresh
#                        container, its own fresh mock fleet), which
#                        pushes only to the production sites - and even
#                        then, only because this job explicitly sets
#                        PRODUCTION_APPROVED=true. site.yml's
#                        push_authorized fact refuses to push a production
#                        device without that variable, so approval is
#                        enforced twice: once by GitLab (the manual gate),
#                        once in the playbook itself (the explicit flag).
#
# run_playbook.sh starts and stops mock_device_server.py for you in both
# jobs - you never invoke either script directly, here or locally.
#
# Each job's own logs/ artifact records what it did - the production job's
# is the audit trail that a human actually approved a real deploy, not
# just a local run of run_playbook.sh.
#
# REQUIRED CI/CD VARIABLES (Settings > CI/CD > Variables) - mark every one
# of these Protected AND Masked. There is no built-in default: pick any
# username/password you like for each environment. mock_device_server.py
# reads these same four variables and genuinely checks incoming requests
# against them - a mismatch between what site.yml sends and what the mock
# expects fails with a real 401. Neither group_vars/prod.yml nor
# group_vars/staging.yml ever holds a credential:
#
#   RESTCONF_PROD_USERNAME
#   RESTCONF_PROD_PASSWORD
#   RESTCONF_STAGING_USERNAME
#   RESTCONF_STAGING_PASSWORD
#
# See .env.example for the same four variables, used for local runs only.
#
# To harden this further the way a real team would: in GitLab, go to
# Settings > CI/CD > Environments and mark "production" as a protected
# environment, restricting who is even allowed to trigger the
# deploy_production job in the first place.
#
# OFFLINE ENVIRONMENT: this course's lab VMs have no internet access, so
# these jobs deliberately do NOT pull python:3.11-slim fresh or pip install
# anything at runtime - both would need to reach Docker Hub / PyPI, which
# don't exist from here. Instead, both jobs use cicd-lab-ansible:latest, a
# custom image with ansible-core already baked in (see the Dockerfile in
# this same folder), which must already be sitting in the GitLab Runner
# host's local Docker image cache before this pipeline runs - see
# README.md -> "Offline CI environment" for how that image gets built
# once (elsewhere, with internet) and loaded onto this host.

stages:
  - build_and_stage
  - deploy_production

default:
  image: cicd-lab-ansible:latest

build_and_stage:
  stage: build_and_stage
  script:
    - ./run_playbook.sh --limit staging
  artifacts:
    when: always
    paths:
      - output/
      - logs/
    expire_in: 1 week

deploy_production:
  stage: deploy_production
  needs: ["build_and_stage"]
  when: manual
  environment:
    name: production
  variables:
    PRODUCTION_APPROVED: "true"
  script:
    - ./run_playbook.sh --limit prod
  artifacts:
    when: always
    paths:
      - output/
      - logs/
    expire_in: 1 week
